<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dual View — Table</title>
<style>
  :root {
    --ink: #e8e2d4;
    --ink-dim: #9a9484;
    --badge-bg: rgba(20, 17, 12, 0.82);
    --ok: #8fb96a;
    --warn: #d0a04a;
    --bad: #c2634f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #14110c;
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* The stage fills the window; its background follows whatever the DM's
     popout is using, sent with each payload. */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage.dragging { cursor: grabbing; }

  #content {
    transform-origin: 50% 50%;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
    flex-shrink: 0;
  }
  #content img {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #content .text {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6%;
    white-space: pre-wrap;
    font-size: clamp(20px, 5.5vmin, 64px);
    line-height: 1.3;
  }

  /* Landing, empty and waiting states. */
  #idle {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }
  #idle h1 {
    font-size: clamp(22px, 4vmin, 34px);
    font-weight: normal;
    letter-spacing: 0.06em;
  }
  #idle p { color: var(--ink-dim); font-size: 15px; max-width: 42ch; line-height: 1.5; }
  #idle .rule {
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--ink-dim), transparent);
  }
  #idle .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
  }
  #idle .action {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid var(--ink-dim);
    border-radius: 999px;
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
  }
  #idle .action:hover, #idle .action:focus-visible {
    border-color: var(--ink);
    background: rgba(232, 226, 212, 0.06);
  }
  #idle .tip { font-size: 13px; }
  .hidden { display: none !important; }

  /* Connection badge, bottom-left, out of the way of most map corners. */
  #badge {
    position: fixed;
    left: 12px;
    bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--badge-bg);
    border-radius: 999px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.6s ease;
    z-index: 10;
  }
  #badge.faded { opacity: 0; }
  #badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn);
  }
  #badge.ok .dot { background: var(--ok); }
  #badge.bad .dot { background: var(--bad); }

  /* Transfer progress, only shown while a large image is arriving. */
  #progress {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: transparent;
    z-index: 11;
  }
  #progress .bar {
    height: 100%;
    width: 0%;
    background: var(--ink-dim);
    transition: width 0.15s linear;
  }

  /* Corner toolbar, bottom-right, mirroring the badge. Faded until used so
     it stays out of the picture. */
  #toolbar {
    position: fixed;
    right: 12px;
    bottom: 12px;
    display: flex;
    gap: 8px;
    z-index: 10;
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }
  #toolbar:hover, #toolbar:focus-within { opacity: 1; }
  #toolbar .tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    height: 34px;
    padding: 0 12px;
    border: none;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }

  /* Colour override panel, above the toolbar. */
  #palette {
    position: fixed;
    right: 12px;
    bottom: 54px;
    background: var(--badge-bg);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
    z-index: 10;
  }
  #palette label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #palette input[type="color"] {
    width: 34px; height: 24px;
    border: none; padding: 0;
    background: none;
    cursor: pointer;
  }
  #palette button {
    border: 1px solid var(--ink-dim);
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  #palette button:hover { border-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    #badge, #progress .bar, #toolbar { transition: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="content"></div>
</div>

<div id="idle">
  <h1 id="idleTitle">Remote Table</h1>
  <div class="rule"></div>
  <p id="idleMsg">Connecting…</p>
  <div class="actions">
    <a id="owlbearBig" class="action hidden" target="_blank" rel="noopener">Open Owlbear Rodeo</a>
    <button id="ambientBig" class="action hidden" type="button">Open ambient screen</button>
  </div>
  <p id="idleTip" class="tip hidden">The ambient screen opens in a new tab. Drag the tab out to put it on another monitor, then press ⛶ in its corner for full screen.</p>
</div>

<div id="badge"><span class="dot"></span><span id="badgeText">Connecting</span></div>

<div id="toolbar">
  <a id="owlbearBtn" class="tool hidden" target="_blank" rel="noopener" title="Open Owlbear Rodeo">Map</a>
  <button id="ambientBtn" class="tool hidden" type="button" title="Open the ambient screen in a new tab">Ambient</button>
  <button id="fullBtn" class="tool" type="button" title="Full screen" aria-label="Full screen">⛶</button>
  <button id="paletteBtn" class="tool" type="button" title="Colours" aria-label="Colour settings">Aa</button>
</div>
<div id="palette" class="hidden">
  <label>Background <input type="color" id="pickBg"></label>
  <label>Text <input type="color" id="pickText"></label>
  <button id="followDm" type="button">Follow DM</button>
</div>
<div id="progress"><div class="bar" id="progressBar"></div></div>

<script>
(function () {
  "use strict";

  // One link does everything. ?room= is the DM's room; ?obr= is their
  // Owlbear Rodeo room; ?view=ambient marks the window this page opens for
  // the ambient screen.
  var params = new URLSearchParams(location.search);
  var room = params.get("room");
  var isAmbient = params.get("view") === "ambient";
  var view = isAmbient ? "ambient" : "main";

  var stage = document.getElementById("stage");
  var content = document.getElementById("content");
  var idle = document.getElementById("idle");
  var idleTitle = document.getElementById("idleTitle");
  var idleMsg = document.getElementById("idleMsg");
  var idleTip = document.getElementById("idleTip");
  var badge = document.getElementById("badge");
  var badgeText = document.getElementById("badgeText");
  var progressBar = document.getElementById("progressBar");
  var owlbearBtn = document.getElementById("owlbearBtn");
  var owlbearBig = document.getElementById("owlbearBig");
  var ambientBtn = document.getElementById("ambientBtn");
  var ambientBig = document.getElementById("ambientBig");
  var fullBtn = document.getElementById("fullBtn");

  if (isAmbient) {
    document.title = "Dual View — Ambient";
    idleTitle.textContent = "Ambient";
  }

  var badgeFadeTimer = null;

  function setBadge(state, text, fade) {
    badge.classList.remove("ok", "bad", "faded");
    if (state) badge.classList.add(state);
    badgeText.textContent = text;
    if (badgeFadeTimer) clearTimeout(badgeFadeTimer);
    if (fade) badgeFadeTimer = setTimeout(function () { badge.classList.add("faded"); }, 2500);
  }

  if (!room) {
    idleMsg.textContent = "No room in the link. Ask your DM for a new player link.";
    setBadge("bad", "No room ID");
    return;
  }

  /* ---- Owlbear Rodeo, the ambient window, full screen ------------------- */

  // Only plain web links get through. The value comes from the URL, so
  // anything else (javascript: and friends) is dropped.
  function safeUrl(s) {
    if (!s) return null;
    try {
      var u = new URL(s);
      return (u.protocol === "https:" || u.protocol === "http:") ? u.href : null;
    } catch (e) {
      return null;
    }
  }

  var linkOwlbear = safeUrl(params.get("obr"));

  function setOwlbear(url) {
    var u = safeUrl(url);
    [owlbearBtn, owlbearBig].forEach(function (a) {
      if (u) a.href = u; else a.removeAttribute("href");
      a.classList.toggle("hidden", !u);
    });
  }

  // Opens the ambient screen in a named tab. Opening by name with no URL
  // returns the existing tab untouched if there is one, so pressing the
  // button again just switches to it rather than reloading it or stacking
  // up copies. A brand-new tab comes back blank and is pointed at the page.
  function openAmbient() {
    var u = new URL(location.href);
    u.search = "";
    u.hash = "";
    u.searchParams.set("room", room);
    u.searchParams.set("view", "ambient");
    var w = window.open("", "dv-ambient-" + room);
    if (!w) {
      idle.classList.remove("hidden");
      idleMsg.textContent = "Your browser blocked the ambient tab. Allow pop-ups for this page and try again.";
      return;
    }
    var fresh = true;
    try { fresh = w.location.href === "about:blank"; } catch (e) {}
    if (fresh) w.location.href = u.href;
    try { w.focus(); } catch (e) {}
  }

  if (!isAmbient) {
    setOwlbear(linkOwlbear);
    ambientBtn.classList.remove("hidden");
    ambientBig.classList.remove("hidden");
    idleTip.classList.remove("hidden");
    ambientBtn.addEventListener("click", openAmbient);
    ambientBig.addEventListener("click", openAmbient);
  }

  if (!document.fullscreenEnabled) fullBtn.classList.add("hidden");
  fullBtn.addEventListener("click", function () {
    var p = document.fullscreenElement
      ? document.exitFullscreen()
      : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(function () {});
  });

  function showWaiting(text) {
    if (content.hasChildNodes()) return;
    idle.classList.remove("hidden");
    idleMsg.textContent = text;
  }

  /* ---- Connection ------------------------------------------------------- */

  // Both ends ping every HEARTBEAT_MS, and a link silent for DEAD_MS is dead.
  // PeerJS never reports a channel that dies with a sleeping machine or
  // dropped wifi; it just goes quiet.
  var HEARTBEAT_MS = 10000;
  var DEAD_MS = 35000;
  // How long one attempt to reach the DM may take before it's abandoned.
  var DIAL_TIMEOUT_MS = 15000;
  // How long to wait on the broker before starting over with a fresh peer.
  var REGISTER_TIMEOUT_MS = 20000;

  var peer = null;
  var peerStartedAt = 0;
  var brokerFailures = 0;
  var conn = null;           // the one live or pending connection
  var dialTimer = null;
  var retryTimer = null;
  var lastSeen = 0;
  var hostHeartbeat = false; // the DM's plugin pings; older versions don't

  function isOpen() { return !!(conn && conn.open); }

  // Closes the current connection, if any. Every handler below ignores
  // events from any connection but the current one, so a stale attempt can
  // never start a second, duplicate connection.
  function dropConn() {
    if (dialTimer) { clearTimeout(dialTimer); dialTimer = null; }
    var c = conn;
    conn = null;
    if (c) { try { c.close(); } catch (e) {} }
  }

  function scheduleRetry(text, delay) {
    setBadge("bad", text || "Reconnecting…");
    if (retryTimer) return;
    retryTimer = setTimeout(function () {
      retryTimer = null;
      connect();
    }, delay == null ? 4000 : delay);
  }

  function retryNow() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    connect();
  }

  function newPeer() {
    if (peer) {
      var old = peer;
      peer = null;
      try { old.destroy(); } catch (e) {}
    }
    var p = new Peer();
    peer = p;
    peerStartedAt = Date.now();
    p.on("open", function () {
      if (p !== peer) return;
      brokerFailures = 0;
      dial();
    });
    // The broker link dropped. An open connection to the DM keeps working;
    // re-register quietly so the next dial has a broker to go through.
    p.on("disconnected", function () {
      if (p !== peer) return;
      setTimeout(function () {
        if (p === peer && p.disconnected && !p.destroyed) {
          try { p.reconnect(); } catch (e) {}
        }
      }, 1000);
    });
    p.on("error", function (err) {
      if (p !== peer) return;
      var type = err && err.type;
      if (type === "peer-unavailable") {
        // The DM's room isn't up. PeerJS leaves the attempt open; close it.
        dropConn();
        showWaiting("Waiting for your DM… this page connects on its own once their table is up. If this link is from an earlier session, ask for the new one.");
        scheduleRetry("Waiting for DM", 4000);
        return;
      }
      // One connection's WebRTC setup failing says nothing about the broker.
      if (type !== "webrtc" && type !== "negotiation-failed") brokerFailures += 1;
      if (!isOpen()) {
        dropConn();
        showWaiting("Having trouble reaching the connection server. This page keeps retrying on its own.");
        scheduleRetry("Connection trouble", Math.min(15000, 2000 * Math.max(1, brokerFailures)));
      }
    });
  }

  // Works out what's missing and fixes that one thing: a peer, a broker
  // registration, or the connection itself. Safe to call any time.
  function connect() {
    if (isOpen() || dialTimer) return;
    if (!peer || peer.destroyed || brokerFailures >= 3) {
      newPeer();
      return; // its "open" dials
    }
    if (peer.disconnected) {
      try { peer.reconnect(); } catch (e) { newPeer(); }
      return; // "open" fires again once re-registered, and dials
    }
    if (!peer.open) {
      if (Date.now() - peerStartedAt > REGISTER_TIMEOUT_MS) newPeer();
      return; // still registering; "open" dials
    }
    dial();
  }

  function dial() {
    if (isOpen() || dialTimer || !peer || !peer.open) return;
    dropConn();
    setBadge(null, "Connecting…");
    var c = null;
    try { c = peer.connect(room, { reliable: true, metadata: { view: view } }); } catch (e) {}
    if (!c) { scheduleRetry("Connection trouble"); return; }
    conn = c;
    hostHeartbeat = false;
    dialTimer = setTimeout(function () {
      dialTimer = null;
      if (c !== conn || c.open) return;
      dropConn();
      showWaiting("Still trying to reach your DM…");
      scheduleRetry("No answer", 1000);
    }, DIAL_TIMEOUT_MS);

    c.on("open", function () {
      if (c !== conn) { try { c.close(); } catch (e) {} return; }
      if (dialTimer) { clearTimeout(dialTimer); dialTimer = null; }
      lastSeen = Date.now();
      incoming = null;
      setProgress(null);
      setBadge("ok", "Connected", true);
      showWaiting(isAmbient
        ? "Connected. The ambient scene appears here when the DM sets one."
        : "Connected. Waiting for the DM to send something…");
    });
    c.on("data", function (msg) {
      if (c !== conn) return;
      lastSeen = Date.now();
      onData(msg);
    });
    c.on("close", function () {
      if (c !== conn) return;
      dropConn();
      scheduleRetry("Disconnected", 1000);
    });
    c.on("error", function () {
      if (c !== conn) return;
      dropConn();
      scheduleRetry("Disconnected", 1000);
    });
  }

  // Heartbeat plus watchdog: pings the DM, drops a link that has gone
  // silent, and restarts the whole chain if nothing is in flight.
  function tick() {
    if (isOpen()) {
      try { conn.send({ k: "ping" }); } catch (e) {}
      // Only hold the DM to the heartbeat once their plugin has shown it
      // pings, so an older plugin isn't dropped every 35 seconds.
      if (hostHeartbeat && Date.now() - lastSeen > DEAD_MS) {
        dropConn();
        scheduleRetry("Connection lost", 0);
      }
    } else if (!retryTimer && !dialTimer) {
      connect();
    }
  }

  // Coming back to the tab or the network: don't wait out the retry timer.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !isOpen()) retryNow();
  });
  window.addEventListener("online", function () {
    if (!isOpen()) retryNow();
  });

  /* ---- Protocol: hello | ping | style | clear | text | head + chunks + end */

  var incoming = null; // { id, parts: [], received, total, mime, bg }
  var currentUrl = null;

  function toUint8(b) {
    if (b instanceof Uint8Array) return b;
    if (b instanceof ArrayBuffer) return new Uint8Array(b);
    if (b && b.buffer) return new Uint8Array(b.buffer, b.byteOffset || 0, b.byteLength);
    return null;
  }

  function setProgress(f) {
    progressBar.style.width = (f == null ? 0 : Math.round(f * 100)) + "%";
  }

  function onData(msg) {
    if (!msg || typeof msg !== "object") return;

    if (msg.k === "ping") {
      hostHeartbeat = true;
      // Answer straight away. Browsers slow timers in background tabs, so
      // the page's own pings can lag; replying from the message event keeps
      // the DM's side from mistaking a background tab for a dead one.
      try { conn.send({ k: "pong" }); } catch (e) {}
      return;
    }

    if (msg.k === "hello") {
      hostHeartbeat = true;
      if (!isAmbient) setOwlbear(msg.owlbear || linkOwlbear);
      return;
    }

    if (msg.k === "style") {
      if (msg.backgroundColor) dmColors.bg = msg.backgroundColor;
      if (msg.textColor) dmColors.text = msg.textColor;
      if (msg.fontFamily) dmColors.font = msg.fontFamily;
      if (content.hasChildNodes()) applyColors();
      return;
    }

    if (msg.k === "clear") {
      incoming = null;
      setProgress(null);
      clearContent();
      stage.style.background = "";
      idle.classList.remove("hidden");
      idleMsg.textContent = isAmbient
        ? "No ambient scene right now. It'll appear here when the DM sets one."
        : "The table is between scenes. This page will update when the DM sends something.";
      return;
    }

    if (msg.k === "text") {
      incoming = null;
      setProgress(null);
      showText(msg);
      return;
    }

    if (msg.k === "head") {
      incoming = {
        id: msg.id,
        total: msg.chunks,
        received: 0,
        parts: new Array(msg.chunks),
        mime: msg.mime || "application/octet-stream",
        bg: msg.backgroundColor || "#000000",
      };
      setProgress(0);
      return;
    }

    if (msg.k === "chunk") {
      if (!incoming || msg.id !== incoming.id) return; // stale transfer
      var bytes = toUint8(msg.b);
      if (!bytes) return;
      if (!incoming.parts[msg.i]) incoming.received += 1;
      incoming.parts[msg.i] = bytes;
      if (incoming.total > 4) setProgress(incoming.received / incoming.total);
      return;
    }

    if (msg.k === "end") {
      if (!incoming || msg.id !== incoming.id) return;
      if (incoming.received !== incoming.total) { incoming = null; setProgress(null); return; }
      var blob = new Blob(incoming.parts, { type: incoming.mime });
      showImage(blob, incoming.bg);
      incoming = null;
      setProgress(null);
    }
  }

  /* ---- Colours: DM-sent values with optional player overrides ----------- */

  var dmColors = { bg: "#000000", text: "#ffffff", font: "inherit" };
  var overrides = { bg: null, text: null };
  try {
    var saved = JSON.parse(localStorage.getItem("dv-viewer-colors") || "{}");
    if (/^#[0-9a-fA-F]{6}$/.test(saved.bg || "")) overrides.bg = saved.bg;
    if (/^#[0-9a-fA-F]{6}$/.test(saved.text || "")) overrides.text = saved.text;
  } catch (e) {}

  function saveOverrides() {
    try { localStorage.setItem("dv-viewer-colors", JSON.stringify(overrides)); } catch (e) {}
  }

  var paletteBtn = document.getElementById("paletteBtn");
  var palette = document.getElementById("palette");
  var pickBg = document.getElementById("pickBg");
  var pickText = document.getElementById("pickText");

  // Restyles whatever's currently on screen. Called on every render, every
  // style update from the DM and every picker change, so changes apply live
  // without a resend. "inherit" is the DM's Obsidian theme font, which this
  // page can't know, so it falls back to the page's own.
  function applyColors() {
    stage.style.background = overrides.bg || dmColors.bg;
    var t = content.querySelector(".text");
    if (t) {
      t.style.color = overrides.text || dmColors.text;
      t.style.fontFamily = dmColors.font && dmColors.font !== "inherit" ? dmColors.font : "";
    }
    pickBg.value = overrides.bg || dmColors.bg;
    pickText.value = overrides.text || dmColors.text;
  }

  paletteBtn.addEventListener("click", function () {
    palette.classList.toggle("hidden");
  });
  pickBg.addEventListener("input", function () {
    overrides.bg = pickBg.value;
    saveOverrides();
    applyColors();
  });
  pickText.addEventListener("input", function () {
    overrides.text = pickText.value;
    saveOverrides();
    applyColors();
  });
  document.getElementById("followDm").addEventListener("click", function () {
    overrides.bg = null;
    overrides.text = null;
    saveOverrides();
    applyColors();
  });

  /* ---- Rendering -------------------------------------------------------- */

  function clearContent() {
    content.innerHTML = "";
    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
    resetView();
  }

  function showImage(blob, bg) {
    clearContent();
    idle.classList.add("hidden");
    dmColors.bg = bg || "#000000";
    currentUrl = URL.createObjectURL(blob);
    var img = document.createElement("img");
    img.src = currentUrl;
    img.alt = "";
    content.appendChild(img);
    applyColors();
  }

  function showText(msg) {
    clearContent();
    idle.classList.add("hidden");
    dmColors.bg = msg.backgroundColor || "#000000";
    dmColors.text = msg.textColor || "#ffffff";
    dmColors.font = msg.fontFamily || "inherit";
    var div = document.createElement("div");
    div.className = "text";
    div.textContent = msg.text || "";
    content.appendChild(div);
    applyColors();
  }

  /* ---- Zoom and pan ------------------------------------------------------ */

  var scale = 1, panX = 0, panY = 0;
  var MIN_SCALE = 0.25, MAX_SCALE = 12;

  function applyTransform() {
    content.style.transform =
      "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
  }

  function resetView() {
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  }

  function zoomAt(cx, cy, factor) {
    var next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    factor = next / scale;
    if (factor === 1) return;
    // Keep the point under the cursor fixed while scaling.
    var rect = stage.getBoundingClientRect();
    var ox = cx - rect.left - rect.width / 2;
    var oy = cy - rect.top - rect.height / 2;
    panX = ox - (ox - panX) * factor;
    panY = oy - (oy - panY) * factor;
    scale = next;
    applyTransform();
  }

  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  stage.addEventListener("dblclick", resetView);

  // Pointer events cover mouse drag and one or two finger touch. Two active
  // pointers become a pinch; the pair's midpoint also pans.
  var pointers = new Map();
  var pinchStart = null;

  stage.addEventListener("pointerdown", function (e) {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) stage.classList.add("dragging");
    if (pointers.size === 2) pinchStart = null; // recalibrate on next move
  });

  stage.addEventListener("pointermove", function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) return;

    if (pointers.size === 1) {
      panX += e.clientX - p.x;
      panY += e.clientY - p.y;
      applyTransform();
    } else if (pointers.size === 2) {
      p.x = e.clientX; p.y = e.clientY;
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var midX = (pts[0].x + pts[1].x) / 2;
      var midY = (pts[0].y + pts[1].y) / 2;
      if (pinchStart) {
        zoomAt(midX, midY, dist / pinchStart.dist);
        panX += midX - pinchStart.midX;
        panY += midY - pinchStart.midY;
        applyTransform();
      }
      pinchStart = { dist: dist, midX: midX, midY: midY };
      return;
    }
    p.x = e.clientX; p.y = e.clientY;
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    pinchStart = null;
    if (!pointers.size) stage.classList.remove("dragging");
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  /* ---- Go ---------------------------------------------------------------- */

  // PeerJS is served from this site first, so the page doesn't depend on a
  // CDN being up; the CDNs are only fallbacks.
  var PEERJS_SRCS = [
    "vendor/peerjs.min.js",
    "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
    "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
  ];

  function loadPeerJs(done) {
    if (window.Peer) { done(true); return; }
    (function next(i) {
      if (i >= PEERJS_SRCS.length) { done(false); return; }
      var s = document.createElement("script");
      s.src = PEERJS_SRCS[i];
      s.onload = function () { if (window.Peer) done(true); else next(i + 1); };
      s.onerror = function () { s.remove(); next(i + 1); };
      document.head.appendChild(s);
    })(0);
  }

  loadPeerJs(function (ok) {
    if (!ok) {
      idleMsg.textContent = "Couldn't load the connection library. Check your internet connection, then refresh.";
      setBadge("bad", "Offline");
      return;
    }
    connect();
    setInterval(tick, HEARTBEAT_MS);
  });
})();
</script>
</body>
